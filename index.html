<body>

<br>

<div id="sku">

    <center>
<form class="container">
    <h3 style="color: rgb(89, 35, 140);"> SKU GENERATOR </h3>

    <br><br>

<div>
    <label class="form-label" style="color: rgb(116, 50, 129); float: left;"> Category: </label>
    <input type="text" class="form-control" id="category" placeholder="Food, Merchandise"></input>
</div>

<br>

<div>
    <label class="form-label" style="color: rgb(116, 50, 129); float: left;"> Product Name: </label>
        <input type="text" id="product_name" class="form-control" placeholder="Apple, Coffee, Sticker">
</div>

<br>

<div>
    <label class="form-label" style="color: rgb(116, 50, 129); float: left;"> Product Stock: </label>
        <input type="number" id="quantity" class="form-control" placeholder="101, 34">
</div>

<br>

    <button type="button" py-click="SKU_generator"> Generate SKU </button>

<br><br>

    <div id="sku_output"></div>


</form>

</div>

<br><br><br><br><br><br><br>

<center>
<div class="container-fluid" style="background-color: rgb(198, 155, 255);">
<p> Millicent Meneses | 10 Ruby ©2026</p>
</div>
</center>
  

    <script type="py">
from pyscript import display, document

def SKU_generator(e):

    document.getElementById('sku_output').innerHTML = " "
    category = document.getElementById('category').value
    product_name = document.getElementById('product_name').value
    stock_qty = document.getElementById('quantity').value
    
    sku = category[:3].upper() + "-" + product_name[:4].upper() + "-" + str(stock_qty)
    display("SKU: ", sku, target='sku_output')

    </script>

    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
